version: 0.1.1
description: Iperf command based on esp-idf console
url: https://github.com/espressif/iperf-cmd/tree/master/iperf-cmd
repository: https://github.com/espressif/iperf-cmd.git
documentation: https://iperf.fr/iperf-doc.php
issues: https://github.com/espressif/iperf-cmd/issues
license: Apache-2.0
dependencies:
  idf: '>=4.3'
  espressif/iperf:
    version: =0.1.1
    # Same monorepo: when iperf-cmd is fetched via git, resolve sibling iperf
    # from the same commit instead of Component Registry.
    override_path: ../iperf
examples:
  - path: ../apps/iperf/
files:
  exclude:
    - doxygen/**/*
    - doxygen
